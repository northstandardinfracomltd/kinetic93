    <meta name="robots" content="noindex, nofollow" />

    <title>Défibeo</title>
    <!-- Open Graph / SEO Banner -->
    <!-- Auto-recovery and SW cleanup for Firebase Hosting updates -->
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (let registration of registrations) {
            registration.unregister();
          }
        });
      }
      window.addEventListener('error', function(e) {
        if (e.message && (e.message.includes('module script') || e.message.includes('MIME type') || e.message.includes('Loading chunk'))) {
          if (!sessionStorage.getItem('reloaded_for_chunk')) {
            sessionStorage.setItem('reloaded_for_chunk', 'true');
            window.location.reload();
          }
        }
      }, true);
    </script>
    <meta property="og:title" content="Défibeo" />

    <meta name="twitter:title" content="Défibeo" />
